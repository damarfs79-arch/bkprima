services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: bkprima-app:latest
    container_name: bkprima_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    networks:
      - bkprima_net
      - rfid_network

  vite:
    image: bkprima-app:latest
    container_name: bkprima_vite
    restart: unless-stopped
    working_dir: /var/www
    command: npm run dev
    volumes:
      - .:/var/www
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      - app
    networks:
      - bkprima_net

  nginx:
    image: nginx:alpine
    container_name: bkprima_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bkprima_net

networks:
  bkprima_net:
    driver: bridge
  rfid_network:
    name: rfid-smkpgri5_rfid_network
    external: true
